<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholarship for International Students</title>
<meta name="description" content="Daily scholarships, internships, volunteering, summits and study-abroad opportunities for international students.">
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#14213d;--muted:#5b6475;--gold:#c8892b;--navy:#14213d;--line:#e6e1d3;--ok:#1d7a4d;--bad:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f36;--ink:#f2efe6;--muted:#a3abc0;--gold:#e5a64a;--navy:#0a0f1d;--line:#27314d;--ok:#4cc38a;--bad:#ff7b6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.logo{font-family:Georgia,"Times New Roman",serif}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
nav{background:var(--navy);color:#f2efe6}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{font-size:1.1rem;font-weight:700;text-decoration:none;color:#f2efe6}
.logo span{color:var(--gold)}
nav .links{display:flex;gap:16px;font-size:.92rem}
nav .links a{text-decoration:none;color:#d9d6cb}
nav .links a:hover{color:var(--gold)}
.hero{background:var(--navy);color:#f2efe6;padding:36px 0 54px;text-align:center}
.hero h1{font-size:clamp(1.7rem,6vw,2.7rem);line-height:1.2;margin:0 0 10px}
.hero p{max-width:560px;margin:0 auto 20px;color:#c9ccd6}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--gold);color:#14213d;font-weight:700;padding:11px 20px;border-radius:10px;text-decoration:none;font-size:1rem}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.pull{margin-top:-30px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 24px rgba(20,33,61,.08)}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:120px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip.on{background:var(--navy);color:#f2efe6;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.chip.on{background:var(--gold);color:#14213d;border-color:var(--gold)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin:22px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.card h3{margin:0;font-size:1.1rem;line-height:1.3}
.meta{font-size:.88rem;color:var(--muted)}
.badge{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid currentColor;width:fit-content}
.open{color:var(--ok)}.closed{color:var(--bad)}
.sec{padding:10px 0 36px}
.sec h2{margin:0 0 6px}
.two{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row input{flex:1;min-width:200px}
form label{display:block;font-size:.88rem;margin:10px 0 4px;color:var(--muted)}
.msg{margin-top:10px;font-size:.92rem}
.detail h1{font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.25;margin:6px 0 10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.back{display:inline-block;margin:20px 0 4px;color:var(--muted);text-decoration:none}
footer{background:var(--navy);color:#c9ccd6;text-align:center;padding:26px 18px;font-size:.88rem}
footer a{color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="#/">Scholarship for <span>International Students</span></a>
  <div class="links"><a href="#/">Opportunities</a><a href="#/subscribe">Subscribe</a><a href="#/contact">Contact</a><a id="fbl" target="_blank" rel="noopener">Facebook</a></div>
</div></nav>
<div id="app"></div>
<footer>© <span id="yr"></span> Scholarship for International Students · Always verify details on the official website before applying · <a id="fbf" target="_blank" rel="noopener">Follow on Facebook</a></footer>

<script>
/* ========= CONFIG: edit these 4 lines ========= */
var CONFIG = {
  FACEBOOK_URL: "https://www.facebook.com/share/1cafeb1847/",
  SHEET_CSV_URL: "",                  // Google Sheet "Publish to web" CSV link (main data source)
  DATA_URL: "opportunities.json",     // used only if SHEET_CSV_URL is empty
  SIGNUP_WEBHOOK: "",                 // paste your n8n Production webhook URL for email signups
  CONTACT_WEBHOOK: ""                 // paste your n8n Production webhook URL for the contact form
};
/* ============================================== */

var FALLBACK=[{slug:"example-scholarship",title:"Example Scholarship (replace me)",category:"Scholarship",country:"Worldwide",deadline:"2027-01-31",funding:"Fully funded",description:"This is sample data shown when opportunities.json cannot be loaded.",eligibility:"International students.",apply_link:"https://example.com"}];
var DATA=[],cur="All",term="";
var CATS=["All","Scholarship","Volunteering","Internship","Summit","Study Abroad"];
var app=document.getElementById("app");
document.getElementById("yr").textContent=new Date().getFullYear();
document.getElementById("fbl").href=document.getElementById("fbf").href=CONFIG.FACEBOOK_URL;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:"#"}
function isOpen(d){if(!d.deadline||!/^\d{4}-\d{2}-\d{2}$/.test(d.deadline))return true;return d.deadline>=new Date().toISOString().slice(0,10)}
function dl(d){return /^\d{4}/.test(d.deadline||"")?d.deadline:(d.deadline||"Rolling")}

function parseCSV(t){var rows=[],r=[],c="",q=false,i,ch;for(i=0;i<t.length;i++){ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";rows.push(r);r=[]}else c+=ch}if(c!==""||r.length){r.push(c);rows.push(r)}return rows}
function slugify(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80)}
function fromCSV(t){var rows=parseCSV(t),h=rows.shift().map(function(x){return x.trim().toLowerCase().replace(/\s+/g,"_")});
  return rows.filter(function(r){return r.join("").trim()}).map(function(r){var o={};h.forEach(function(k,i){o[k]=(r[i]||"").trim()});o.slug=o.slug||slugify(o.title);return o}).reverse()}
function load(){
  var sheet=!!CONFIG.SHEET_CSV_URL;
  fetch(sheet?CONFIG.SHEET_CSV_URL:CONFIG.DATA_URL+"?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return sheet?r.text():r.json()})
   .then(function(j){DATA=sheet?fromCSV(j):(Array.isArray(j)?j:(j.items||[]))}).catch(function(){DATA=FALLBACK}).then(route);
}

function cards(){
  var t=term.toLowerCase();
  var list=DATA.filter(function(d){return(cur==="All"||d.category===cur)&&((d.title||"")+(d.country||"")+(d.category||"")).toLowerCase().indexOf(t)>-1})
   .sort(function(a,b){var oa=isOpen(a),ob=isOpen(b);if(oa!==ob)return oa?-1:1;return(a.deadline||"9")<(b.deadline||"9")?-1:1});
  return list.length?list.map(function(d){return '<a class="card" href="#/o/'+encodeURIComponent(d.slug)+'"><span class="tag">'+esc(d.category)+'</span><h3>'+esc(d.title)+'</h3><div class="meta">'+esc(d.country)+(d.funding?' · '+esc(d.funding):'')+'</div><div class="meta">Deadline: '+esc(dl(d))+'</div><span class="badge '+(isOpen(d)?'open">Open':'closed">Closed')+'</span></a>'}).join(""):'<div class="empty" style="grid-column:1/-1">No opportunities match your search.</div>';
}

function signupBox(){return '<div class="panel"><h2>Never miss a deadline</h2><p class="meta">Get new scholarships and opportunities in your inbox.</p><form class="row" data-hook="signup"><input type="email" name="email" placeholder="Your email address" required><button class="btn" type="submit">Subscribe</button></form><div class="msg"></div></div>'}

function home(){
  app.innerHTML='<div class="hero"><div class="wrap"><h1>Find your next scholarship abroad</h1><p>Scholarships, internships, volunteering, summits and study-abroad programs for international students, updated daily.</p><a class="btn" href="#/subscribe">Get email alerts</a> <a class="btn ghost" href="'+esc(CONFIG.FACEBOOK_URL)+'" target="_blank" rel="noopener">Follow on Facebook</a></div></div>'+
  '<div class="wrap pull"><div class="panel"><input id="q" type="search" placeholder="Search by title, country or type…" value="'+esc(term)+'"><div class="chips" id="chips"></div></div><div class="grid" id="grid">'+cards()+'</div><div class="sec">'+signupBox()+'</div></div>';
  var ch=document.getElementById("chips");
  CATS.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c===cur?" on":"");b.textContent=c;b.onclick=function(){cur=c;home()};ch.appendChild(b)});
  document.getElementById("q").oninput=function(e){term=e.target.value;document.getElementById("grid").innerHTML=cards()};
  bindForms();
}

function detail(slug){
  var d=DATA.filter(function(x){return x.slug===slug})[0];
  if(!d){app.innerHTML='<div class="wrap"><a class="back" href="#/">← All opportunities</a><div class="empty">Opportunity not found.</div></div>';return}
  document.title=d.title+" | Scholarship for International Students";
  app.innerHTML='<div class="wrap detail"><a class="back" href="#/">← All opportunities</a><div class="panel"><span class="tag">'+esc(d.category)+'</span><h1>'+esc(d.title)+'</h1><span class="badge '+(isOpen(d)?'open">Open':'closed">Closed')+'</span>'+
  '<div class="facts"><div class="fact"><b>Country</b>'+esc(d.country||"—")+'</div><div class="fact"><b>Deadline</b>'+esc(dl(d))+'</div><div class="fact"><b>Funding</b>'+esc(d.funding||"See official site")+'</div></div>'+
  '<h3>About</h3><p>'+esc(d.description)+'</p>'+(d.eligibility?'<h3>Eligibility</h3><p>'+esc(d.eligibility)+'</p>':'')+(d.how_to_apply?'<h3>How to apply</h3><p>'+esc(d.how_to_apply)+'</p>':'')+
  '<p><a class="btn" href="'+esc(safeUrl(d.apply_link))+'" target="_blank" rel="noopener">Apply on official website</a> <button class="btn ghost" id="sh">Share</button></p></div><div class="sec" style="padding-top:22px">'+signupBox()+'</div></div>';
  document.getElementById("sh").onclick=function(){var u=location.href;if(navigator.share){navigator.share({title:d.title,url:u}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(u);this.textContent="Link copied"}};
  bindForms();
}

function subscribe(){app.innerHTML='<div class="wrap" style="padding-top:28px"><div class="sec">'+signupBox()+'</div></div>';bindForms()}
function contact(){
  app.innerHTML='<div class="wrap" style="padding-top:28px"><div class="panel"><h2>Contact us</h2><p class="meta">Questions, suggestions or an opportunity to share? Send us a message.</p><form data-hook="contact"><label>Your name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Message</label><textarea name="message" required></textarea><p><button class="btn" type="submit">Send message</button></p></form><div class="msg"></div></div></div>';
  bindForms();
}

function bindForms(){
  [].forEach.call(document.querySelectorAll("form[data-hook]"),function(f){
    f.onsubmit=function(e){
      e.preventDefault();
      var kind=f.getAttribute("data-hook"),url=kind==="signup"?CONFIG.SIGNUP_WEBHOOK:CONFIG.CONTACT_WEBHOOK;
      var out=(f.parentNode.querySelector(".msg")||f.nextElementSibling);
      if(!url){out.style.color="var(--bad)";out.textContent="This form is not connected yet (add the n8n webhook URL in CONFIG).";return}
      var body={type:kind,page:location.href,time:new Date().toISOString()};
      [].forEach.call(new FormData(f).entries?Array.from(new FormData(f).entries()):[],function(p){body[p[0]]=p[1]});
      out.style.color="var(--muted)";out.textContent="Sending…";
      fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
       .then(function(r){if(!r.ok)throw 0;out.style.color="var(--ok)";out.textContent=kind==="signup"?"You are subscribed. Thank you!":"Message sent. Thank you!";f.reset()})
       .catch(function(){out.style.color="var(--bad)";out.textContent="Something went wrong. Please try again."});
    };
  });
}

function route(){
  var h=location.hash.replace(/^#/,"")||"/";document.title="Scholarship for International Students";
  window.scrollTo(0,0);
  if(h.indexOf("/o/")===0)detail(decodeURIComponent(h.slice(3)));
  else if(h==="/contact")contact();
  else if(h==="/subscribe")subscribe();
  else home();
}
window.addEventListener("hashchange",route);
load();
</script>
</body>
</html>
